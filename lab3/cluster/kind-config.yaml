kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: observability-demo

# Версия Kubernetes (можно прибить гвоздями для воспроизводимости)
# Без этого kind возьмёт последнюю стабильную
# image: kindest/node:v1.30.0

nodes:
  # Управляющий узел — «мозг» кластера (API Server, etcd, scheduler)
  - role: control-plane
  # Рабочие узлы — здесь крутятся ваши приложения
  - role: worker
  - role: worker

# Сеть внутри кластера
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"