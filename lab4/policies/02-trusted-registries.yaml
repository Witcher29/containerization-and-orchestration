apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: trusted-registries
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |
        object.spec.containers.all(c,
          c.image.startsWith("gcr.io/distroless/") ||
          c.image.startsWith("docker.io/library/") ||
          c.image.startsWith("shop-api") ||
          c.image.startsWith("shop-worker"))
      message: "images must come from trusted registries: gcr.io/distroless/*, docker.io/library/*, or local shop-*"