apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shop.fullname" . }}-batch
  labels:
    app: shop-batch
    {{- toYaml .Values.commonLabels | nindent 4 }}
spec:
  replicas: {{ .Values.batch.replicaCount }}
  selector:
    matchLabels:
      app: shop-batch
  template:
    metadata:
      labels:
        app: shop-batch
        {{- toYaml .Values.commonLabels | nindent 8 }}
    spec:
      {{- if eq .Values.batch.scheduling.strategy "topologySpreadConstraints" }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.batch.scheduling.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.batch.scheduling.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.batch.scheduling.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: shop-batch
      {{- else if eq .Values.batch.scheduling.strategy "podAntiAffinity" }}
      affinity:
        podAntiAffinity:
          {{- toYaml .Values.batch.scheduling.podAntiAffinity | nindent 10 }}
      {{- end }}
      containers:
        - name: batch
          image: "{{ .Values.batch.image.repository }}:{{ .Values.batch.image.tag }}"
          imagePullPolicy: {{ .Values.batch.image.pullPolicy }}
          env:
            - name: BATCH_MEMORY_TARGET_MIB
              value: {{ .Values.batch.env.memoryTargetMiB | quote }}
            - name: BATCH_BLOCK_MIB
              value: {{ .Values.batch.env.blockMiB | quote }}
            - name: BATCH_CPU_BURN
              value: {{ .Values.batch.env.cpuBurn | quote }}
            - name: BATCH_ALLOC_INTERVAL_MS
              value: {{ .Values.batch.env.allocIntervalMs | quote }}
          resources:
            {{- toYaml .Values.batch.resources | nindent 12 }}
{{- end }}
