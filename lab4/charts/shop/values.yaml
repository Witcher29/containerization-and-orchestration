commonLabels:
  owner: team-shop
  env: dev

api:
  replicaCount: 2
  image:
    repository: shop-api
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  env:
    port: "8080"
    healthFail: "false"

  scheduling:
    strategy: topologySpreadConstraints

    topologySpreadConstraints:
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule

    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: shop-api
          topologyKey: kubernetes.io/hostname

worker:
  replicaCount: 2
  image:
    repository: shop-worker
    tag: v1
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "300m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

postgres:
  image:
    repository: docker.io/library/postgres
    tag: "16-alpine"
  service:
    port: 5432
  resources:
    requests: { cpu: "20m", memory: "128Mi" }
    limits: { cpu: "20m", memory: "128Mi" }   # Guaranteed
  auth:
    user: shop
    password: shop
    db: shop

batch:
  enabled: true
  replicaCount: 1
  image:
    repository: shop-batch
    tag: v1
    pullPolicy: IfNotPresent

  # Burstable: requests заметно ниже limits (гвардрейлы Лабы 3 соблюдены — limits есть).
  # Числа сдержанные под 4 CPU / 8 GB VM, чтобы Часть 2 не завалила кластер.
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # Управление поведением batch через env, без пересборки образа.
  env:
    memoryTargetMiB: "200"     # плато по RSS в MiB
    blockMiB: "10"             # размер одной аллокации
    cpuBurn: "true"            # жжёт ли CPU на плато
    allocIntervalMs: "100"     # пауза между аллокациями до выхода на плато

  scheduling:
    strategy: topologySpreadConstraints
    topologySpreadConstraints:
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: shop-batch
          topologyKey: kubernetes.io/hostname