apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged
  labels:
    app: bad-test
    owner: me
    env: dev
spec:
  containers:
    - name: c
      image: docker.io/library/busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
        requests:
          cpu: "100m"
          memory: "64Mi"