{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# DNS is a shared dependency. All pods in this namespace may query CoreDNS only on port 53.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-dns-egress
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# API is reachable from the host through the kind NodePort, from approved in-cluster clients,
# and from Prometheus in the monitoring namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-ingress
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      network-role: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              network-role: api-client
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - ipBlock:
            cidr: {{ .Values.networkPolicy.nodeCIDR | quote }}
      ports:
        - protocol: TCP
          port: 8080
---
# The API can open database connections, but cannot initiate arbitrary network connections.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-egress
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      network-role: api
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              network-role: database
      ports:
        - protocol: TCP
          port: 5432
---
# A labelled test/client pod may call the API service; arbitrary pods cannot.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-client-egress
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      network-role: api-client
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              network-role: api
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
---
# Worker needs PostgreSQL, but it does not accept inbound connections from other app pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-worker-egress
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      network-role: worker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              network-role: database
      ports:
        - protocol: TCP
          port: 5432
---
# PostgreSQL accepts connections only from API, worker, and the CloudNativePG operator.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgres-ingress
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      network-role: database
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              network-role: api
        - podSelector:
            matchLabels:
              network-role: worker
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
