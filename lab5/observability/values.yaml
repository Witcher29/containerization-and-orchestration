kube-prometheus-stack:
  grafana:
    enabled: true

    adminUser: admin
    adminPassword: admin

    service:
      type: ClusterIP

    persistence:
      enabled: false

    sidecar:
      datasources:
        enabled: true
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL

    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://observability-loki:3100
        isDefault: false

    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
      sidecar:

  prometheus:
    prometheusSpec:
      retention: 2d
      resources:
        requests:
          cpu: "200m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
      serviceMonitorNamespaceSelector: { }
      serviceMonitorSelector:
        matchLabels:
          release: observability
      additionalScrapeConfigs:
        - job_name: api-service
          static_configs:
            - targets:
                - shop-api.default.svc.cluster.local:80

  alertmanager:
    enabled: true
    alertmanagerSpec:
      resources:
        requests:
          cpu: "20m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"


loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false

    commonConfig:
      replication_factor: 1

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    storage:
      type: filesystem

  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "300m"
        memory: "512Mi"

  gateway:
    enabled: false

  backend:
    replicas: 0

  read:
    replicas: 0

  write:
    replicas: 0

  chunksCache:
    enabled: false

  resultsCache:
    enabled: false


alloy:
  controller:
    type: daemonset

  alloy:
    configMap:
      create: true
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app"
          }
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://observability-loki:3100/loki/api/v1/push"
          }
        }


jaeger:
  provisionDataStore:
    cassandra: false

  storage:
    type: memory

  allInOne:
    enabled: false

  collector:
    enabled: false

  query:
    enabled: false