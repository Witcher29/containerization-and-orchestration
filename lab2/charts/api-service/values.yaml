replicaCount: 1

image:
  repository: api-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

env:
  port: "8080"
  selfUrl: "http://api-service:80"
  loadRequests: "20"
  httpClientTimeout: "5s"

otel:
  endpoint: "jaeger:4318"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi